name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# A PUSH SUPERSEDES THE ONE BEFORE IT. This matrix takes a while, and pushing twice in five minutes
# otherwise runs both to completion for a commit nobody is waiting on. Tags are excluded: a release
# run must never be cancelled by whatever lands next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# READ-ONLY BY DEFAULT. Only the release job writes anything, and it asks for that itself. Until
# now every job in the matrix carried a token that could push to this repository - seventy-odd jobs
# running a build tool, a game, and a third-party publishing action, none of which need it.
permissions:
  contents: read

jobs:
  # WHAT THE COMPILER CANNOT CHECK. Mixin targets are strings resolved at launch, so a method
  # Mojang renamed compiles perfectly and fails at startup - and the mod claims a range of
  # versions it is only ever compiled against one of. This job checks every target and every
  # imported vanilla type against each supported version's own client jar.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Client jars are pinned by version and sha1-verified, so caching them is safe.
      - name: Cache Minecraft client jars
        uses: actions/cache@v5
        with:
          path: build/minecraft
          key: mcjars-${{ hashFiles('tools/verify_targets.py') }}
      - name: Verify mixin targets across the supported range
        run: |
          python tools/verify_targets.py             26.2 26.1.2 26.1.1 26.1 1.21.11 1.21.10 1.21.9 1.21.8 1.21.7 1.21.6 1.21.5 1.21.4 1.21.3 1.21.2 1.21.1 1.21 1.20.6 1.20.5

  # Drives a REAL client: builds a world, summons an item_display carrying item_model, and checks
  # the mod reads it, intercepts its command and honours its config. This is the only coverage that
  # exercises the mod's own logic rather than its ability to load.
  #
  # A NARROWER RANGE THAN THE MOD SUPPORTS, for two reasons - and note that "26.x has no Loom" is
  # NOT one of them. Fabric publishes the client gametest harness for 26.x as well, and the harness
  # is just a mod: gradle/run26.gradle drops it into the run directory and launches it by hand, so
  # 26.x runs the very same test class. What actually bounds this list:
  #
  #   * the harness does not exist below 1.21.4 - checked against each version's own fabric-api POM
  #   * 1.21.9 through 1.21.11 cannot load a world on a hosted runner (see below)
  #
  # Everything excluded is still launched and exercised by the smoke job above.
  #
  # WHY NOT 1.21.9 - 1.21.11. On a GitHub runner their integrated server freezes at "Preparing
  # spawn area: 16%" until the harness's one-minute budget expires, and the run fails with "Timeout
  # loading world". It is not this mod and it is not the runner:
  #
  #   * 1.21.4 - 1.21.8 and all four 26.x versions load a world on the same runner, and 26.x passes
  #     through that very 16% line in under a second
  #   * 1.21.11 loads in 21 seconds on a developer machine
  #   * launching those three WITHOUT Loom - the production-mode launcher used by the job below -
  #     fails on the runner in exactly the same way, which rules out Loom's dev environment
  #
  # Also ruled out by experiment: render distance, per-frame cost, a frame-rate cap (which made it
  # worse - the harness steps client and server together, so a slower client is a slower server),
  # llvmpipe's thread count, the client pausing on lost focus, and Minecraft's background pool being
  # one thread wide on a two-core runner. What is left is something specific to 1.21.9+ world
  # generation under a constrained runner, and it is not worth more CI minutes to chase.
  # Run it locally on those versions: ./gradlew runClientGameTest -Pminecraft_version=1.21.11
  gametest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.1.2', '26.1.1', '26.1',
             '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # The client needs a GL context even to reach the title screen; xvfb provides one headlessly.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The harness exits the game itself and reports through the exit code, so a failed assertion
      # fails the job. The run config forces java.awt.headless: without it Fabric reports a bad mod
      # set in a modal dialog and waits for a click that will never come, burning the whole timeout
      # while looking exactly like a test still running.
      # Loom provides this task on 1.21.x; gradle/runclient.gradle defines one with the same name on
      # 26.x, so the matrix needs no special case.
      - name: Client game test
        timeout-minutes: 20
        run: xvfb-run -a ./gradlew runClientGameTest -Pminecraft_version=${{ matrix.mc }}

      - name: Upload the run log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-log-${{ matrix.mc }}
          # Loom runs in run/, the hand-rolled 26.x launcher in build/run<version>/.
          path: |
            run/logs/
            build/run*/logs/
            build/run*/crash-reports/
          if-no-files-found: ignore

  # THE SAME GAMETEST, RUN THE WAY AN INSTALLED GAME RUNS: obfuscated client jar, intermediary
  # mappings applied by Loader at launch, mods remapped on the way in. Every other gametest job
  # above is a DEVELOPMENT launch, where the runtime keeps official names - and that difference
  # hides real bugs. It hid one here: the clicked-command check looked its target up by name, found
  # nothing against intermediary, and reported the path as absent on a version that has it.
  #
  # One version is enough to keep that path exercised; it is a cross-check on the harness, not
  # per-version coverage.
  gametest-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
      # THE ONE JOB THAT WRITES THE CACHE. Saving costs about forty seconds, and on the default
      # branch every job does it by default - eighty near-identical saves per run, racing each
      # other. One writer keeps it fresh; everyone else restores read-only.
      - uses: gradle/actions/setup-gradle@v5
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Client game test, production-mode launch
        timeout-minutes: 20
        run: xvfb-run -a ./gradlew runClientGameTestStandalone -Pminecraft_version=1.21.8
      - name: Upload the run log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-production-log
          path: build/run*/logs/
          if-no-files-found: ignore

  # EVERY SUPPORTED VERSION, ACTUALLY LAUNCHED. The gametest above covers more per version but runs
  # on nine of eighteen: the harness does not exist below 1.21.4, and 1.21.9 through 1.21.11
  # cannot load a world on a hosted runner. This job starts a
  # real client on all eighteen instead, and checks the two things most likely to break when a version
  # moves underneath the mod - that the item_model component still resolves out of the registry, and
  # that the config still drives the matcher.
  #
  # 26.x has no Loom and therefore no run task; gradle/run26.gradle assembles the launch by hand, so
  # the task name is the same on both paths and the matrix needs no special case.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.1.2', '26.1.1', '26.1', '1.21.11', '1.21.10', '1.21.9', '1.21.8', '1.21.7',
             '1.21.6', '1.21.5', '1.21.4', '1.21.3', '1.21.2', '1.21.1', '1.21', '1.20.6', '1.20.5']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # The client needs a GL context even to reach the title screen; xvfb provides one headlessly.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Cache Minecraft client jars
        uses: actions/cache@v5
        with:
          path: build/minecraft
          key: mc-${{ matrix.mc }}-${{ hashFiles('gradle.properties') }}

      # The verdict comes from a file the test writes, not from the exit code - no exit from a
      # client thread survives contact with GLFW - so the smokeTest task is what fails the job.
      # BOTH LOADERS IN ONE JOB. Each launch is well under a minute of work wrapped in a minute and
      # a half of setup - cache restore, client jar - and that setup is identical for both. As
      # separate jobs it was paid twice per version, for eighteen versions.
      - name: Smoke test, Fabric
        timeout-minutes: 20
        run: xvfb-run -a ./gradlew smokeTest -Pminecraft_version=${{ matrix.mc }}

      # The SAME jar under Quilt Loader. Quilt needs no jar of its own, and this is the test behind
      # the Modrinth listing claiming Quilt on the Fabric file.
      - name: Smoke test, Quilt Loader
        timeout-minutes: 20
        run: xvfb-run -a ./gradlew quiltSmokeTest -Pminecraft_version=${{ matrix.mc }}

      - name: Upload the run log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log-${{ matrix.mc }}
          # Loom runs in run/, the hand-rolled 26.x launcher in build/run<version>/.
          path: |
            run/logs/
            run/crash-reports/
            build/run*/logs/
            build/run*/crash-reports/
          if-no-files-found: ignore

  # THE NEOFORGE JAR, ACTUALLY LAUNCHED. Same contract as the Fabric smoke job and the same task
  # name - the build defines smokeTest on both paths - but a completely different runtime: NeoForge's
  # own loader, its own mod metadata, its own mixin plumbing. Those are exactly the NeoForge-specific
  # things that a compile cannot check, and the mod's shared code is what the checks assert.
  #
  # Eleven versions, matching the eleven NeoForge publishes a stable build for.
  smoke-neoforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # FEWER AT ONCE, because the failures here are not ours. Eleven jobs starting together all
      # fetch net.neoforged:minecraft-dependencies from maven.neoforged.net, and that host has now
      # dropped the request twice, on two different versions - while returning 200 to a plain curl
      # for both. Four at a time asks less of it.
      max-parallel: 4
      matrix:
        mc: ['26.2', '26.1.2', '1.21.11', '1.21.10', '1.21.8', '1.21.5', '1.21.4', '1.21.3',
             '1.21.1', '1.21', '1.20.6']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ONE RETRY, for that same host. A dependency-resolution failure costs seconds, so a second
      # attempt is cheap; a real failure costs one extra run of a two-minute test, which is a price
      # worth paying to stop an unrelated maven hiccup turning the matrix red. It does NOT paper
      # over flaky code: the mod's own failures fail both attempts.
      - name: Smoke test
        timeout-minutes: 25
        run: |
          for attempt in 1 2; do
            if xvfb-run -a ./gradlew smokeTest -Ploader=neoforge -Pminecraft_version=${{ matrix.mc }}; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 20
          done
          exit 1

      - name: Upload the run log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-neoforge-log-${{ matrix.mc }}
          path: |
            build/run-neoforge-*/logs/
            build/run-neoforge-*/crash-reports/
          if-no-files-found: ignore

  # One source tree, two build paths: 26.x compiles against Mojang's already-readable client jar
  # with no mappings at all, 1.21.x goes through Loom and is remapped to intermediary. Both are
  # built on every push, because the only thing that reliably catches a version-specific break is
  # compiling it - the target checker above is static and cannot see member access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.1.2', '26.1.1', '26.1', '1.21.11', '1.21.10', '1.21.9', '1.21.8', '1.21.7',
             '1.21.6', '1.21.5', '1.21.4', '1.21.3', '1.21.2', '1.21.1', '1.21', '1.20.6', '1.20.5']
        loader: ['fabric']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # BOTH TOOLCHAINS, EVERY JOB. The build picks the one matching the client jar it compiles
      # against - 26.x is class-file 69 (Java 25), 1.21.x is 65 (Java 21) - so the matrix does not
      # have to carry a java column that only ever repeats the version prefix.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # The client jar and MC's libraries are ~112 MB fetched from Mojang. They are pinned by
      # version and sha1-verified, so caching them is safe and turns a cold minute into seconds.
      - name: Cache Minecraft compile classpath
        uses: actions/cache@v5
        with:
          path: build/minecraft
          key: mc-${{ matrix.mc }}-${{ matrix.loader }}-${{ hashFiles('gradle.properties') }}

      - run: ./gradlew build -Pminecraft_version=${{ matrix.mc }} -Ploader=${{ matrix.loader }}

      - uses: actions/upload-artifact@v7
        with:
          name: hidemodels-${{ matrix.mc }}-${{ matrix.loader }}
          path: build/libs/*.jar
          if-no-files-found: error
          # The release job consumes these in the same run; nothing reads them later.
          retention-days: 7

  # THE NEOFORGE JARS, in a job of their own rather than as rows in the matrix above - because they
  # need something Fabric does not: fewer at a time, and a retry. Their toolchain resolves
  # net.neoforged:minecraft-dependencies from maven.neoforged.net, which has now dropped requests
  # under this matrix's load three times across three runs, on four different versions, while
  # answering a plain curl for every one of them. Fabric's eighteen stay wide and fast.
  #
  # Eleven versions: the ones NeoForge has a STABLE build for. The other seven - 26.1.1, 26.1,
  # 1.21.9, 1.21.7, 1.21.6, 1.21.2 and 1.20.5 - have only betas or an alpha, checked against their
  # maven rather than guessed.
  build-neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mc: ['26.2', '26.1.2', '1.21.11', '1.21.10', '1.21.8', '1.21.5', '1.21.4', '1.21.3',
             '1.21.1', '1.21', '1.20.6']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build
        run: |
          for attempt in 1 2; do
            if ./gradlew build -Pminecraft_version=${{ matrix.mc }} -Ploader=neoforge; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: hidemodels-${{ matrix.mc }}-neoforge
          path: build/libs/*.jar
          if-no-files-found: error
          # The release job consumes these in the same run; nothing reads them later.
          retention-days: 7

  # ONE TAG SHIPS THE WHOLE RANGE. A v* tag publishes a single Release carrying a jar per supported
  # Minecraft version, built by the matrix above.
  #
  # A JOB OF ITS OWN, not a step inside the matrix, for two reasons. The release is created exactly
  # once here, where twelve parallel jobs each doing "create it if it does not exist" would race and
  # two of them would lose. And `needs` makes publishing conditional on the tests: a tag whose smoke
  # run fails on some version produces no release at all, rather than a half-published one.
  release:
    permissions:
      contents: write        # creates the release and uploads the jars
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [targets, smoke, smoke-neoforge, gametest, gametest-production, build,
            build-neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for docs/releases/<tag>.md, below.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: hidemodels-*
          path: dist
          merge-multiple: true      # every jar in one directory, not one directory per version

      # NOTES COME FROM THE REPO WHEN THERE ARE ANY. --generate-notes alone lists commit subjects,
      # which describe the work rather than the release - useful to us, meaningless to someone
      # deciding whether to download a jar. Written notes go in docs/releases/<tag>.md and the
      # generated list is appended below them by the API. A tag without that file still releases,
      # with the generated list alone.
      # RE-RUNNABLE. A tag gets re-run for reasons that have nothing to do with the jars - a flaky
      # runner, or a CI change that has to be published from the same code - and `gh release create`
      # fails outright when the release exists. Uploading over the existing one leaves the notes and
      # the download count intact.
      # A CHECKSUM FILE beside the jars. Twenty-nine files built by a machine nobody can see is
      # exactly the case where "is this the jar CI produced" is worth being able to answer.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists - replacing its jars"
            gh release upload "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.jar \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
          else
            echo "no $notes - falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" dist/*.jar \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # THE SAME JARS ON MODRINTH. Nothing on Modrinth's side watches this repo - a release there is
  # something we push - so this mirrors what the job above publishes to GitHub.
  #
  # ONE MODRINTH VERSION PER MINECRAFT VERSION, which is why this is a matrix rather than one upload
  # of twelve files. Each jar is built and remapped against exactly one game version and declares it,
  # so grouping them under a single Modrinth version would offer someone on 1.21.2 a jar that cannot
  # load for them.
  #
  # Runs after the GitHub release, and inherits its gate on the test jobs: if the smoke run failed
  # anywhere, neither publish happens. Skips silently until MODRINTH_PROJECT_ID is set, so a fork
  # without the secret is not a broken workflow.
  modrinth:
    if: startsWith(github.ref, 'refs/tags/v') && vars.MODRINTH_PROJECT_ID != ''
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.1.2', '26.1.1', '26.1', '1.21.11', '1.21.10', '1.21.9', '1.21.8', '1.21.7',
             '1.21.6', '1.21.5', '1.21.4', '1.21.3', '1.21.2', '1.21.1', '1.21', '1.20.6', '1.20.5']
        loader: ['fabric']
        # The same eleven the build matrix publishes a NeoForge jar for.
        include:
          - {mc: '26.2', loader: 'neoforge'}
          - {mc: '26.1.2', loader: 'neoforge'}
          - {mc: '1.21.11', loader: 'neoforge'}
          - {mc: '1.21.10', loader: 'neoforge'}
          - {mc: '1.21.8', loader: 'neoforge'}
          - {mc: '1.21.5', loader: 'neoforge'}
          - {mc: '1.21.4', loader: 'neoforge'}
          - {mc: '1.21.3', loader: 'neoforge'}
          - {mc: '1.21.1', loader: 'neoforge'}
          - {mc: '1.21', loader: 'neoforge'}
          - {mc: '1.20.6', loader: 'neoforge'}
    steps:
      - uses: actions/checkout@v5      # only for the changelog file

      - uses: actions/download-artifact@v8
        with:
          name: hidemodels-${{ matrix.mc }}-${{ matrix.loader }}
          path: dist

      # The tag without its leading v, so the Modrinth version reads mc26.2-1.5.0-fabric - the same
      # string the jar itself is named with.
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # PINNED TO A COMMIT, NOT A TAG. This is a third-party action holding a token that can publish
      # under our name; a tag can be moved, a commit cannot. v3.3.1.
      #
      # Nothing updates this pin automatically, which is the trade being made rather than an
      # oversight: a pinned action keeps behaving exactly as it did the day it was pinned, and the
      # failure mode is missing out on fixes, not breaking on a Tuesday. Check it when the release
      # process is next touched - github.com/Kir-Antipov/mc-publish/releases - and move the SHA and
      # the version comment together.
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          # Named the way Sodium names its versions: "Hide Models 1.5.0 for Fabric 26.2", with a
          # version string of mc26.2-1.5.0-fabric. Sorting by Minecraft version is what someone
          # scanning a long version list actually wants, and the loader goes last because there are
          # now three of them.
          name: >-
            Hide Models ${{ steps.version.outputs.number }} for
            ${{ matrix.loader == 'fabric' && 'Fabric/Quilt' || 'NeoForge' }} ${{ matrix.mc }}
          version: mc${{ matrix.mc }}-${{ steps.version.outputs.number }}-${{ matrix.loader }}
          version-type: release
          game-versions: ${{ matrix.mc }}
          # QUILT IS LISTED ON THE FABRIC JAR because the Fabric jar IS the Quilt jar - the same
          # file, and CI launches it under Quilt Loader on all eighteen versions. Stated rather than
          # inferred: letting the action guess from fabric.mod.json would claim only Fabric, and
          # would have no way of knowing the NeoForge jar is a different file entirely.
          loaders: ${{ matrix.loader == 'fabric' && 'fabric,quilt' || 'neoforge' }}
          # Fabric API is required on Fabric and Quilt, and irrelevant on NeoForge, where the same
          # work is done by NeoForge's own events.
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}
          changelog-file: docs/releases/${{ github.ref_name }}.md
          # FEATURED IS DECIDED, NOT RACED. The action unfeatures older versions on every upload, so
          # with twenty-nine jobs in parallel the featured one was whichever finished last -
          # arbitrary, and different every release. Newest Minecraft, and the loader most people
          # here are on.
          modrinth-featured: ${{ matrix.mc == '26.2' && matrix.loader == 'fabric' }}
