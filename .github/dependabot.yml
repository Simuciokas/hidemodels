# Keeps the actions in build.yml current.
#
# This exists because of how the last two problems were found: GitHub's Node 20 deprecation arrived
# as a banner someone happened to read, and the third-party publish action is pinned to a commit
# SHA, which is the right thing to do and also the thing that quietly goes stale. Dependabot opens
# a PR for both instead - and a PR runs the full matrix, so an update that breaks a version is
# caught before it is merged rather than at the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly       # this workflow changes rarely; weekly would be noise
    commit-message:
      prefix: ci
    labels: []
