import groovy.json.JsonSlurper
import java.security.MessageDigest

// TWO BUILD PATHS, ONE SOURCE TREE. 26.x ships a client jar already in readable official names and
// publishes no mapping file at all, so Loom cannot work there (it fails with "Failed to find
// official mojang mappings") and is not needed - the jar is compiled and shipped as-is. Every
// earlier version ships an OBFUSCATED jar, so a mod for those MUST be remapped to intermediary
// before it will load, which is exactly what Loom is for.
//
// Select with -Pminecraft_version=1.21.8; the default in gradle.properties is the 26.x path.
plugins {
    id 'java'
    id 'fabric-loom' version '1.17.20' apply false
}

def legacy = !project.minecraft_version.startsWith('26')
ext.isLegacy = legacy   // read by gradle/run26.gradle, which cannot see a local def

// Fabric API is TEST-ONLY here - the harness needs it, the mod does not - but it is published per
// Minecraft version, so one pinned value would only ever let one version run its tests. Listed
// rather than resolved from the network so a build stays reproducible and offline-capable; add a
// row when adding a version to the matrix.
def FABRIC_API = [
        '1.21.2' : '0.106.1+1.21.2',
        '1.21.3' : '0.114.1+1.21.3',
        '1.21.4' : '0.119.4+1.21.4',
        '1.21.5' : '0.128.2+1.21.5',
        '1.21.6' : '0.128.2+1.21.6',
        '1.21.8' : '0.136.1+1.21.8',
        '1.21.11': '0.141.6+1.21.11',
]
def fabricApiVersion = FABRIC_API[project.minecraft_version]
// Fabric's client gametest API arrived in 1.21.4; before that the module does not exist, and 26.x
// does not ship it either. Checked by version rather than by probing the jar, so configuration
// stays offline.
def hasGametest = fabricApiVersion != null && !(project.minecraft_version in ['1.21.2', '1.21.3'])
if (legacy && fabricApiVersion == null) {
    // Only the gametest needs it, so this must not stop an ordinary build.
    logger.lifecycle("no Fabric API pinned for ${project.minecraft_version} - runClientGameTest "
            + "will not be available; add it to FABRIC_API in build.gradle")
}
if (legacy) {
    apply plugin: 'fabric-loom'
}

// ONE FILE DIFFERS BETWEEN VERSIONS, and it is a source set rather than a preprocessor because one
// small class is not worth a build-time source rewriter. The client-facing chat call was renamed -
// LocalPlayer.displayClientMessage up to 1.21.x, sendSystemMessage from 26.x - and reflection
// cannot bridge it, since a 1.21.x build is remapped to intermediary and the runtime name is
// method_NNNN. Everything else in src/main compiles unchanged across the whole range.
sourceSets.main.java.srcDir(legacy ? 'src/mc121/java' : 'src/mc26/java')

// The gametest class implements an interface that does not exist on every version, so it is
// compiled - and declared as an entrypoint - only where it can be.
if (!hasGametest) {
    sourceSets.test.java.exclude('**/HideModelsClientTest.java')
}
// The test mod's metadata comes in two flavours and one is COPIED rather than generated: a
// gametest entrypoint naming a class that does not exist on this version makes Loader fail at
// startup, so the file has to differ, and picking between two readable files beats assembling JSON
// out of string fragments in a build script.
sourceSets.test.resources.srcDir 'src/test/templates'
processTestResources {
    if (hasGametest) {
        exclude 'fabric.mod.json'
        rename 'fabric.mod.gametest.json', 'fabric.mod.json'
    } else {
        exclude 'fabric.mod.gametest.json'
    }
}

// The tests call into the mod they are testing, so they need main's classes AND main's
// dependencies - Gradle gives a test source set neither of the latter by default. True on both
// paths; on 26.x main's classpath is assembled by hand below rather than by Loom, so this has to
// wait until those file collections exist.
if (legacy) {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

// NOTHING IN src/test IS A JUnit TEST, so the `test` task has nothing to run - both things in
// there are Fabric mods driven by a launched client (smokeTest and runClientGameTest), which is the
// only way to test a mod whose logic only exists inside a running game. Gradle 9 fails a build when
// a test task finds sources but discovers no tests, so `./gradlew build` broke on both paths until
// this said out loud that there is nothing to discover.
tasks.named('test') { enabled = false }

// SETTINGS EVERY TEST LAUNCH WANTS, written before the client reads options.txt at startup. Shared
// with gradle/run26.gradle, which launches the versions Loom cannot.
//
//   * MUTED, because a test launch has no business playing sound through whatever speakers the
//     build happened to run on. The master category covers every other one.
//   * AS LITTLE RENDERING AS THE GAME WILL ACCEPT, because CI has no GPU and every frame is drawn
//     on the CPU the integrated server also needs. Nothing here inspects terrain or lighting.
//     Note that CAPPING THE FRAME RATE IS NOT A LEVER HERE, however tempting: the gametest harness
//     steps the client and the server together, so a slower client is a slower server - a 10 fps
//     cap took 1.21.11 from 40 ticks behind to 460.
ext.testClientOptions = [
        'soundCategory_master' : '0.0',
        // NEVER PAUSE. Single-player pauses when the window loses focus, and it pauses the
        // INTEGRATED SERVER with it - under xvfb there is no window manager to give focus to, so
        // this is the difference between a world that loads and one that sits at "Preparing spawn
        // area: 16%" while the server logs that it is 460 ticks behind.
        'pauseOnLostFocus'     : 'false',
        'renderDistance'       : '2',
        'simulationDistance'   : '5',
        'enableVsync'          : 'false',
        'graphicsPreset'       : '"fast"',
        'ao'                   : 'false',
        'biomeBlendRadius'     : '0',
        'entityShadows'        : 'false',
        'entityDistanceScaling': '0.5',
        'mipmapLevels'         : '0',
        'particles'            : '2',        // minimal
        'renderClouds'         : '"false"',
        'gamma'                : '1.0',      // screenshots on failure stay readable
]

// Rewrites only the keys above and leaves anything else in the file alone, so a developer's own
// run/options.txt survives.
ext.writeTestClientOptions = { File f ->
    f.parentFile.mkdirs()
    def kept = f.exists()
            ? f.readLines().findAll { line -> !testClientOptions.keySet().any { line.startsWith(it + ':') } }
            : []
    testClientOptions.each { k, v -> kept << "${k}:${v}" }
    f.text = kept.join(System.lineSeparator()) + System.lineSeparator()
}

if (legacy) {
    def prepareClientOptions = tasks.register('prepareClientOptions') {
        description = 'Mutes the client and trims its render distance before it launches.'
        doLast {
            writeTestClientOptions(file('run/options.txt'))
            logger.lifecycle('client options written (run/options.txt): muted, render distance 2')
        }
    }
    tasks.matching { it.name.startsWith('runClient') }.configureEach { dependsOn prepareClientOptions }
}

version = project.mod_version
group = project.maven_group

// NO FABRIC LOOM, deliberately.
//
// Minecraft 26.2 has NO named mapping source at all:
//   * yarn publishes no 26.2 build
//   * intermediary's mappings.tiny is a 25-byte header with ZERO class entries
//   * Mojang's 26.2 version json ships only 'client' and 'server' - no client_mappings
// That is not an obstacle, it is the reason none is needed: the shipped jar is already in
// readable official names, and because intermediary is an identity mapping, what we compile
// against is exactly what runs. Loom exists to remap; with nothing to remap it only gets in
// the way, failing at configuration time with "Failed to find official mojang mappings".
//
// AND NO LOCAL GAME INSTALL EITHER. The client jar and MC's own libraries are fetched from
// Mojang's piston metadata, the same source any launcher uses, so a bare CI runner can build
// this. Downloads are verified against the sha1 the manifest publishes and land in
// build/minecraft/<version>/, where they are reused (and cached in CI) rather than re-fetched.

repositories {
    mavenCentral()
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
}

def mcVersion = project.minecraft_version
def mcRoot = layout.buildDirectory.dir("minecraft/${mcVersion}").get().asFile
def clientJar = new File(mcRoot, 'client.jar')
def mcLibs = new File(mcRoot, 'libraries')

def sha1 = { File f ->
    def md = MessageDigest.getInstance('SHA-1')
    f.withInputStream { s ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = s.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

// Download to a .part file and only then move it into place, so an interrupted build cannot
// leave a truncated jar that looks valid to the next one.
def fetch = { String url, File dest, String want ->
    if (dest.isFile() && (want == null || sha1(dest) == want)) return false
    dest.parentFile.mkdirs()
    def part = new File(dest.parentFile, dest.name + '.part')
    java.net.URI.create(url).toURL().withInputStream { i -> part.withOutputStream { o -> o << i } }
    if (want != null && sha1(part) != want) {
        part.delete()
        throw new GradleException("sha1 mismatch downloading ${url}")
    }
    dest.delete()
    if (!part.renameTo(dest)) throw new GradleException("could not move ${part} into place")
    return true
}

def readJson = { String url ->
    new JsonSlurper().parseText(java.net.URI.create(url).toURL().getText('UTF-8'))
}

tasks.register('downloadMinecraft') {
    group = 'build setup'
    description = "Fetches the ${mcVersion} client jar and its libraries from Mojang (compile-only)."
    outputs.upToDateWhen { clientJar.isFile() && mcLibs.isDirectory() }
    doLast {
        def manifest = readJson('https://launchermeta.mojang.com/mc/game/version_manifest_v2.json')
        def entry = manifest.versions.find { it.id == mcVersion }
        if (entry == null) {
            throw new GradleException("Mojang's manifest lists no version '${mcVersion}'")
        }
        def meta = readJson(entry.url)

        fetch(meta.downloads.client.url, clientJar, meta.downloads.client.sha1)

        // Natives are irrelevant to a compile-only classpath, and skipping them halves the
        // download. Everything else goes in, rather than a hand-picked list: MC's own public
        // signatures leak types from libraries this mod never references (DataFixerUpper's
        // Codec, jspecify's @Nullable), and each omission costs a build to discover.
        int got = 0
        meta.libraries.each { lib ->
            def art = lib.downloads?.artifact
            if (art == null || art.path.contains('-natives-')) return
            if (fetch(art.url, new File(mcLibs, art.path), art.sha1)) got++
        }
        logger.lifecycle("minecraft ${mcVersion}: client jar + libraries ready (${got} newly downloaded)")
    }
}

dependencies {
    if (legacy) {
        // The client gametest harness, and ONLY for tests: the mod itself has no Fabric API
        // dependency and the shipped jar declares none. modClientImplementation keeps it off the
        // production classpath entirely.
        // The harness that drives a real client. modImplementation, not testImplementation:
        // only the mod* configurations go through Loom's remapper, and a plain testImplementation
        // hands over the intermediary-named jar - which fails to compile with "cannot access
        // class_310" because the source is written in official names.
        //
        // It being on the dev classpath does not put it in the released jar: nothing declares a
        // dependency on it, and the entrypoint that uses it lives in the test source set's own
        // fabric.mod.json, a separate mod that is never published.
        // THE WHOLE API, not just the gametest module. fabricApi.module() resolves one module
        // without its dependencies, and the harness needs fabric-resource-loader-v0 - Loader
        // refuses to start without it. Chasing the transitive list by hand is a losing game; this
        // is a dev-time dependency either way and costs the released jar nothing.
        // Only where Fabric actually ships the client gametest harness. It was added in 1.21.4,
        // and 26.x has no gametest module at all - on those versions the smoke test is the whole
        // of the automated coverage, and it deliberately needs no Fabric API.
        if (hasGametest) {
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        }

        // Loom's own coordinates. officialMojangMappings() rather than yarn: the source is written
        // in official names for the 26.x path, and asking Loom for the same names means ONE source
        // tree compiles on both sides. Loom remaps the output to intermediary on the way out,
        // which is what an obfuscated-jar version needs in order to load the mod at all.
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    } else {
        // Compile against the real client jar. Nothing here is bundled into the mod.
        compileOnly files(clientJar)
        compileOnly fileTree(dir: mcLibs, include: '**/*.jar')

        // Loader gives us the mod entry contract; sponge-mixin gives us @Mixin/@Invoker.
        // Both are provided at runtime by the Fabric installation.
        compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
        compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"

        // The smoke test is a client mod like any other, so it needs the same three things the mod
        // does. compileOnly on the test side for the same reason: Loader supplies them at runtime,
        // and anything on the runtime classpath twice is a class-loading problem waiting to happen.
        testCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    }
}

// The hand-rolled path has no Loom to attach Minecraft to the test source set, so wire it up the
// same way main is: the downloaded client jar, its libraries, and main's own classes.
if (!legacy) {
    sourceSets.test.compileClasspath += files(clientJar) +
            fileTree(dir: mcLibs, include: '**/*.jar') + sourceSets.main.output
}

if (!legacy) {
    tasks.named('compileJava') { dependsOn 'downloadMinecraft' }
    tasks.named('compileTestJava') { dependsOn 'downloadMinecraft' }
}

// The target has to match the client jar it will run beside: 26.x is class-file major 69 = Java
// 25, 1.21.x is 65 = Java 21. Mixin refuses to load classes newer than its declared
// compatibilityLevel, so hidemodels.mixins.json is templated to agree rather than hardcoded.
if (legacy) {
    loom {
        runs {
            // Runs EVERYWHERE Loom can launch, unlike the gametest below - which is the point of
            // it. Halts the JVM with a status code of its own accord, so CI reads pass or fail
            // from the exit code.
            smokeTest {
                client()
                name = 'Smoke Test'
                source 'test'
                vmArg '-Dhidemodels.smoketest=true'
                vmArg '-Djava.awt.headless=true'
            }
        }
    }
    if (hasGametest) {
        loom {
            runs {
                clientGameTest {
                    client()
                    name = 'Client Game Test'
                    source 'test'
                    // The harness exits the game itself when the test finishes, pass or fail, and
                    // reports through the exit code - which is what makes this usable from CI.
                    vmArg '-Dfabric.client.gametest'
                    // HEADLESS, OR A FAILURE HANGS FOREVER. Fabric Loader reports a bad mod set in
                    // a modal AWT dialog and waits for someone to click it: the run stops dead,
                    // with no output and no exit code, looking exactly like a test still working.
                    // In CI nothing would ever click it. Headless forces the report to the console
                    // and lets the process die.
                    vmArg '-Djava.awt.headless=true'
                }
            }
        }
    }
}

// THE SMOKE TEST'S VERDICT COMES FROM A FILE, not the exit code - see the test class for why no
// exit from a client thread survives contact with GLFW on Windows. The run task is therefore
// allowed to "fail", and this is the task to actually invoke.
if (legacy) {
    tasks.matching { it.name == 'runSmokeTest' }.configureEach {
        ignoreExitValue = true
        // A stale PASS from a previous run would be indistinguishable from a real one.
        doFirst { delete file('run/smoketest-result.txt') }
    }
    tasks.register('smokeTest') {
        group = 'verification'
        description = 'Launches the client and checks the mod runs on this Minecraft version.'
        dependsOn 'runSmokeTest'
        doLast {
            def f = file('run/smoketest-result.txt')
            if (!f.isFile()) {
                throw new GradleException('the smoke test produced no verdict - the client probably '
                        + 'died before reaching it; see the output above')
            }
            def verdict = f.text.trim()
            if (!verdict.startsWith('PASS')) {
                throw new GradleException(verdict)
            }
            logger.lifecycle("smoke test: ${verdict}")
        }
    }
}

def javaVersion = legacy ? 21 : 25
java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

// The metadata has to name the version it was built for, or Loader will happily load a 1.21.8 jar
// on 26.2 and fail at the first missing method. Templated rather than edited per build.
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcDep', "~${project.minecraft_version}"
    inputs.property 'javaVersion', javaVersion
    filesMatching(['fabric.mod.json', 'hidemodels.mixins.json']) {
        expand 'version': project.version,
               'mcDep': "~${project.minecraft_version}",
               'javaVersion': javaVersion
    }
}

jar {
    archiveBaseName = project.archives_base_name
    // 26.x runs what it compiled - intermediary is an identity mapping there, so remapping is a
    // no-op that Loom is not present to perform anyway. On 1.21.x the opposite is true and Loom's
    // remapJar produces the artifact, so the flag must NOT be set.
    if (!legacy) {
        manifest { attributes 'Fabric-Loom-Remap': 'false' }
    }
}

// The jar says which Minecraft it is for, so two of them can sit in one folder without guessing.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
}

// 26.x has no Loom and therefore no run task of its own; this supplies one, and is inert on any
// version Loom handles.
apply from: 'gradle/run26.gradle'
