org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.2 ships NO yarn build and its intermediary mapping table is EMPTY
# (mappings.tiny is a 25-byte header with zero class entries), so intermediary == official
# and the only usable mapping source is Mojang's own. See build.gradle.
minecraft_version=26.2
loader_version=0.19.5
mixin_version=0.17.1+mixin.0.8.7

mod_version=1.5.0
maven_group=io.github.simuciokas
archives_base_name=hidemodels

# NOTE ON JDKs. 26.2's class-file major 69 needs a JDK 25 toolchain, and Gradle itself must run
# on a JVM it supports (25 is fine for Gradle 9.x). Set JAVA_HOME to a JDK 25, or list one for
# Gradle to discover:
#org.gradle.java.installations.paths=/path/to/jdk-25
quilt_loader_version=0.30.1
