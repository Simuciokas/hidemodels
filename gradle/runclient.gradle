// Launching the client by hand, without Loom.
//
// WHY THIS FILE EXISTS. Loom provides runClient for every version it supports, and it supports none
// of 26.x - Mojang publishes no mappings there, which is the same fact that lets this project build
// without Loom at all. So the version actually being played had no way to start the game from the
// build, and therefore no automated test of any kind. This assembles the launch by hand: a small
// slice of what Loom does, because a test needs far less than a development environment.
//
// IT ALSO LAUNCHES 1.21.x, which Loom can start perfectly well - for one specific reason. Loom's
// dev launch of 1.21.9 and later freezes on a GitHub runner: the integrated server sits at
// "Preparing spawn area: 16%" until the gametest harness gives up. The same runner loads a world
// fine for 26.x through THIS launcher, so the difference is not the machine. Launching 1.21.x the
// way an installed game does - obfuscated jar, intermediary mappings applied by Loader at runtime,
// remapped mods in a mods folder - is the experiment that separates "the runner cannot" from
// "Loom's dev launch cannot".
//
// It is deliberately NOT a general-purpose launcher. No accounts, no realms, no multiplayer - it
// starts the client offline, runs a test, and reports.

// FABRIC ONLY. Everything in this file assembles a FABRIC launch - Fabric Loader, its libraries,
// Fabric API as a mod. NeoForge brings its own toolchain and ModDevGradle generates its runs, so on
// that path this file has nothing to say and would only collide with task names.
if (project.loader != 'fabric') {
    return
}

def legacy = project.ext.isLegacy
def mc = project.minecraft_version
def mcRoot = layout.buildDirectory.dir("minecraft/${mc}").get().asFile
def clientJar = new File(mcRoot, 'client.jar')
def mcLibs = new File(mcRoot, 'libraries')
def nativesDir = new File(mcRoot, 'natives')
def assetsDir = new File(mcRoot, 'assets')
def runDir = layout.buildDirectory.dir("run${mc}").get().asFile

// Minecraft's own libraries, MINUS ASM. 1.21.x ships asm 9.6 among its libraries and Fabric Loader
// brings its own newer one; with both on the classpath Loader refuses to start at all - "duplicate
// ASM classes found on classpath" - before a single mod is read. Loader's copy is the one that has
// to win, because its mixin machinery is built against it. 26.x ships no ASM, so this is a no-op
// there.
def mcLibJars = fileTree(dir: mcLibs, include: '**/*.jar', exclude: '**/org/ow2/asm/**')

// Fabric Loader itself. Its runtime dependencies are NOT here - see loaderLibraries below, which
// is where the rest of the launch classpath comes from.
configurations {
    loaderRuntime
    // PRODUCTION-MODE DEOBFUSCATION. A 1.21.x client jar is obfuscated, and mods are built against
    // intermediary names; Loader bridges the two at launch from this artifact, exactly as it does
    // in an installed game. 26.x needs none of it - the jar is already in readable names, which is
    // why intermediary is not even published there.
    intermediaryMappings
    // Fabric API, as a MOD rather than a classpath entry: Loader discovers it from mods/ like any
    // other mod. The mod under test depends on it now - the command is registered through it - so
    // every launch here needs it present or Loader refuses to start. Resolved without transitives
    // on purpose: fabric-api's POM lists all forty-odd modules, while the jar itself bundles the
    // ones needed at runtime.
    fabricApiRuntime { transitive = false }
    // The gametest harness on top, which is a separate artifact and only exists for some versions.
    gametestHarness { transitive = false }
    // QUILT LOADER, for the compatibility check below. Quilt runs Fabric mods, so this launches the
    // very same jar - nothing about the mod is Quilt-specific, and if something were, that would be
    // the finding.
    quiltLoaderRuntime
}
dependencies {
    loaderRuntime "net.fabricmc:fabric-loader:${project.loader_version}"
    if (legacy) {
        intermediaryMappings "net.fabricmc:intermediary:${mc}:v2"
    }
    // Not inside that guard: whether Quilt can run 26.x is the question, so the loader has to be
    // available there to ask it.
    quiltLoaderRuntime "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    fabricApiRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"
    if (project.hasGametest) {
        gametestHarness "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:${project.gametestModuleVersion}"
    }
}

/**
 * The libraries Loader needs at runtime, which its POM does NOT declare.
 *
 * <p>Fabric ships that list inside the loader jar instead, in fabric-installer.json - which is how
 * launchers and Loom both build a launch classpath, and why a plain Gradle resolve of fabric-loader
 * comes back with exactly one jar and dies at "ASM not detected on the classpath". Reading the same
 * file means this follows a loader upgrade automatically, including one that changes asm or mixin.
 *
 * <p>Resolved lazily (files{} defers until the classpath is queried) so an ordinary build does no
 * network work for a task it is not running.
 */
def loaderLibraries = {
    def loaderJar = configurations.loaderRuntime.files.find { it.name.startsWith('fabric-loader') }
    def text = new java.util.zip.ZipFile(loaderJar).withCloseable { zip ->
        zip.getInputStream(zip.getEntry('fabric-installer.json')).getText('UTF-8')
    }
    def libs = new groovy.json.JsonSlurper().parseText(text).libraries
    // "common" plus "client"; "development" is Loom's business (mixinextras for a dev env) and
    // "server" is not this launch.
    def coords = ((libs.common ?: []) + (libs.client ?: []))*.name
    def detached = configurations.detachedConfiguration(
            *coords.collect { dependencies.create(it) })
    detached.files
}

/**
 * Natives, which the compile-only path deliberately skips.
 *
 * The main build drops every artifact with "-natives-" in its path because a compile classpath has
 * no use for them and they double the download. Running needs them: without the extracted .dll/.so
 * files GLFW cannot open a window and the client dies before any mod loads.
 */
tasks.register('extractNatives') {
    group = 'verification'
    description = "Downloads and extracts the ${mc} native libraries, which the build normally skips."
    outputs.dir nativesDir
    doLast {
        def manifest = new groovy.json.JsonSlurper().parseText(
                java.net.URI.create('https://launchermeta.mojang.com/mc/game/version_manifest_v2.json')
                        .toURL().getText('UTF-8'))
        def entry = manifest.versions.find { it.id == mc }
        if (entry == null) {
            throw new GradleException("Mojang's manifest lists no version '${mc}'")
        }
        def meta = new groovy.json.JsonSlurper().parseText(
                java.net.URI.create(entry.url).toURL().getText('UTF-8'))

        def os = org.gradle.internal.os.OperatingSystem.current()
        def arch = System.getProperty('os.arch')
        // THE CLASSIFIER HAS TO MATCH EXACTLY, and it has to carry the architecture. Mojang ships
        // natives-windows, natives-windows-x86 and natives-windows-arm64 side by side; a "contains"
        // test takes all three, flattens them into one directory, and whichever landed last wins -
        // which showed up as "Can't load this .dll (machine code=0x14c) on a AMD 64-bit platform"
        // when the 32-bit build happened to be written second.
        def suffix = (arch in ['aarch64', 'arm64']) ? '-arm64'
                : (arch in ['x86', 'i386', 'i686']) ? '-x86' : ''
        def want = '-natives-' + (os.windows ? 'windows' : (os.macOsX ? 'macos' : 'linux')) +
                suffix + '.jar'
        // Emptied rather than added to: these are flattened into one directory, so a file left by
        // an earlier run - a different architecture, or a different Minecraft version - would still
        // be found on the library path and loaded in preference to nothing.
        delete nativesDir
        nativesDir.mkdirs()
        int taken = 0
        meta.libraries.each { lib ->
            def art = lib.downloads?.artifact
            if (art == null || !art.path.endsWith(want)) {
                return
            }
            def jar = new File(mcRoot, "natives-src/${art.path}")
            if (!jar.isFile()) {
                jar.parentFile.mkdirs()
                java.net.URI.create(art.url).toURL().withInputStream { i ->
                    jar.withOutputStream { o -> o << i }
                }
            }
            // Only the loadable binaries; the jars also carry metadata and licences.
            copy {
                from zipTree(jar)
                into nativesDir
                include '**/*.dll', '**/*.so', '**/*.dylib'
                eachFile { it.path = it.name }      // flat, which is what java.library.path wants
                includeEmptyDirs = false
            }
            taken++
        }
        logger.lifecycle("natives: ${taken} archive(s) extracted to ${nativesDir}")
    }
}

/**
 * An asset index the client will accept, without the gigabyte behind it.
 *
 * Minecraft needs --assetIndex to name a readable index file, but for a smoke test it does not
 * need the objects: the title screen's panorama, the default font and en_us all live inside the
 * client jar, and the only thing an empty store costs is sounds - which this run mutes anyway.
 * Downloading the real store would add most of a gigabyte per version to every CI run for nothing.
 */
tasks.register('stubAssets') {
    group = 'verification'
    description = 'Writes an empty asset index, enough for the client to start.'
    outputs.dir assetsDir
    doLast {
        def indexes = new File(assetsDir, 'indexes')
        indexes.mkdirs()
        new File(assetsDir, 'objects').mkdirs()
        new File(indexes, 'stub.json').text = '{"objects":{}}'
        logger.lifecycle("assets: empty index written to ${indexes}")
    }
}

/** The test mod, as a jar, because Loader discovers mods from a directory in production mode. */
tasks.register('testModJar', Jar) {
    group = 'verification'
    description = 'Packages the test source set as a loadable mod.'
    // archiveFileName, not base + version: build.gradle stamps every archive task with a
    // "<mod>+mc<version>" archiveVersion, which is right for a published jar and noise for a test
    // mod that only ever lives in a run directory. Setting the whole name opts out of that.
    archiveFileName = 'hidemodels-test.jar'
    // NOT into the run directory's mods folder, which the run tasks below clear before each
    // launch: a task whose output lives inside another task's scratch space gets its output
    // deleted out from under it, and then fails as "input file does not exist" on the next run.
    destinationDirectory = layout.buildDirectory.dir('testmod')
    from sourceSets.test.output
    dependsOn 'testClasses'
    // Same marker the shipped jar carries: on 26.x intermediary IS the official mapping, so there
    // is nothing to remap and Loader should not try.
    manifest { attributes 'Fabric-Loom-Remap': 'false' }
}

// EVERYTHING BELOW IS 26.x ONLY. On 1.21.x, Loom already provides runClient and
// runClientGameTest, and build.gradle defines smokeTest against its run task - registering the
// same names here would collide. The standalone gametest further down is the legacy-only half.
if (!legacy) {
    tasks.register('runSmokeTest26', JavaExec) {
        group = 'verification'
        description = "Starts the ${mc} client with the mod and the smoke test, offline."
        dependsOn 'jar', 'testModJar', 'extractNatives', 'stubAssets', 'downloadMinecraft'

        // The jar under test goes in beside the test mod; both are discovered from mods/.
        doFirst {
            def mods = new File(runDir, 'mods')
            mods.mkdirs()
            delete fileTree(mods)
            copy {
                from tasks.jar.archiveFile
                from tasks.named('testModJar').get().archiveFile
                from configurations.fabricApiRuntime
                into mods
            }
            // A stale verdict would be indistinguishable from a fresh one.
            delete new File(runDir, 'smoketest-result.txt')
            // The same options the Loom runs get - muted, and cheap to render on a machine with no GPU.
            writeTestClientOptions(new File(runDir, 'options.txt'))
        }

        classpath = files(clientJar) + mcLibJars +
                configurations.loaderRuntime + files(loaderLibraries)
        mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        workingDir = runDir

        jvmArgs = [
                "-Djava.library.path=${nativesDir}".toString(),
                // LWJGL looks HERE FIRST and does not fall back to java.library.path reliably: with
                // only the latter set it dies at "Failed to locate library: lwjgl.dll" while printing
                // that very file in the directory listing. Launchers set both; so does this.
                "-Dorg.lwjgl.librarypath=${nativesDir}".toString(),
                '-Dhidemodels.smoketest=true',
                // Fabric reports a bad mod set in a modal dialog and waits for a click that will never
                // come in CI - the run would hang until the job timed out, with no output.
                '-Djava.awt.headless=true',
        ]
        args = [
                '--gameDir', runDir.absolutePath,
                // The assets ROOT, the way a launcher passes it: the client resolves the index as
                // <assetsDir>/indexes/<name>.json and the objects beneath it.
                '--assetsDir', assetsDir.absolutePath,
                '--assetIndex', 'stub',
                '--accessToken', '0',
                '--version', mc,
                '--userType', 'legacy',
                '--username', 'SmokeTest',
        ]
        // The verdict comes from the file, so however the JVM dies is not this task's business.
        ignoreExitValue = true
    }

    /**
     * The SAME client gametest Loom runs on 1.21.x, on the versions Loom cannot launch.
     *
     * <p>This is possible because the harness is just a mod: Fabric publishes fabric-client-gametest-api-v1
     * for 26.x too, and what was missing here was never the API - it was a launcher. This file already
     * had one. So the harness jars go into mods/ beside the mod and the test mod, the property that
     * activates it goes on the command line, and the test that runs is the same class, driving a real
     * world through a real client.
     *
     * <p>Unlike the smoke test, the verdict comes from the EXIT CODE: the harness stops the game itself
     * when the test finishes, which is a controlled shutdown rather than a thread halting mid-frame, so
     * the exit status survives. That is why this task does not set ignoreExitValue.
     */
    tasks.register('runClientGameTest', JavaExec) {
        group = 'verification'
        description = "Runs the client gametest on ${mc}: builds a world, summons a model, checks the mod."
        dependsOn 'jar', 'testModJar', 'extractNatives', 'stubAssets', 'downloadMinecraft'
        onlyIf {
            if (!project.hasGametest) {
                logger.lifecycle("no client gametest harness published for ${mc} - skipping")
            }
            project.hasGametest
        }

        doFirst {
            def mods = new File(runDir, 'mods')
            mods.mkdirs()
            delete fileTree(mods)
            copy {
                from tasks.jar.archiveFile
                from tasks.named('testModJar').get().archiveFile
                from configurations.fabricApiRuntime
                into mods
            }
            // The harness on top of the API. No remapping on 26.x - intermediary
            // is the identity mapping there, which is the same reason the mod's own jar ships with
            // Fabric-Loom-Remap: false.
            copy {
                from configurations.gametestHarness
                into mods
            }
            writeTestClientOptions(new File(runDir, 'options.txt'))
        }

        classpath = files(clientJar) + mcLibJars +
                configurations.loaderRuntime + files(loaderLibraries)
        mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        workingDir = runDir

        jvmArgs = [
                "-Djava.library.path=${nativesDir}".toString(),
                "-Dorg.lwjgl.librarypath=${nativesDir}".toString(),
                '-Dfabric.client.gametest',
                '-Djava.awt.headless=true',
        ]
        args = [
                '--gameDir', runDir.absolutePath,
                '--assetsDir', assetsDir.absolutePath,
                '--assetIndex', 'stub',
                '--accessToken', '0',
                '--version', mc,
                '--userType', 'legacy',
                '--username', 'GameTest',
        ]
    }

    tasks.register('smokeTest') {
        group = 'verification'
        description = 'Launches the client and checks the mod runs on this Minecraft version.'
        dependsOn 'runSmokeTest26'
        doLast {
            def f = new File(runDir, 'smoketest-result.txt')
            if (!f.isFile()) {
                throw new GradleException('the smoke test produced no verdict - the client probably '
                        + 'died before reaching it; see the output above')
            }
            def verdict = f.text.trim()
            if (!verdict.startsWith('PASS')) {
                throw new GradleException(verdict)
            }
            logger.lifecycle("smoke test: ${verdict}")
        }
    }
}

// ---------------------------------------------------------------- the standalone 1.21.x gametest
//
// THE EXPERIMENT. Loom's dev launch of 1.21.9+ freezes on a hosted runner at "Preparing spawn
// area: 16%"; the same runner loads a world for 26.x through this launcher without trouble. The
// two differ in three ways at once - dev environment versus production Loader, Loom's launch
// versus this one, and a real asset store versus the stub index here - so this runs the same
// gametest the other way round and lets CI say which side the problem is on.
//
// Everything a released mod needs at runtime, because that is exactly what this is: an obfuscated
// client jar, intermediary mappings for Loader to bridge with, and mods that have been remapped.
// gametestModuleVersion, not just hasGametest: Loom resolves the harness from fabric-api's POM, so
// a Loom version can have a gametest without this project knowing the module's version. Registering
// the task anyway resolved "...:fabric-client-gametest-api-v1:null" and failed the job.
if (legacy && project.hasGametest && project.gametestModuleVersion != null) {

    // The test mod has to be remapped like any other mod. It is compiled against official names
    // and would find nothing at runtime otherwise - the same reason the mod's own jar goes through
    // remapJar before it is published.
    tasks.register('runClientGameTestStandalone', JavaExec) {
        group = 'verification'
        description = "Runs the client gametest on ${mc} WITHOUT Loom, the way an installed game runs."
        dependsOn 'remapJar', 'remapTestModJar', 'extractNatives', 'stubAssets', 'downloadMinecraft'

        doFirst {
            def mods = new File(runDir, 'mods')
            mods.mkdirs()
            delete fileTree(mods)
            copy {
                from tasks.named('remapJar').get().archiveFile
                from tasks.named('remapTestModJar').get().archiveFile
                from configurations.fabricApiRuntime
                from configurations.gametestHarness
                into mods
            }
            writeTestClientOptions(new File(runDir, 'options.txt'))
        }

        classpath = files(clientJar) + mcLibJars +
                configurations.loaderRuntime + files(loaderLibraries) +
                configurations.intermediaryMappings
        mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        workingDir = runDir

        jvmArgs = [
                "-Djava.library.path=${nativesDir}".toString(),
                "-Dorg.lwjgl.librarypath=${nativesDir}".toString(),
                '-Dfabric.client.gametest',
                '-Djava.awt.headless=true',
        ]
        args = [
                '--gameDir', runDir.absolutePath,
                '--assetsDir', assetsDir.absolutePath,
                '--assetIndex', 'stub',
                '--accessToken', '0',
                '--version', mc,
                '--userType', 'legacy',
                '--username', 'GameTest',
        ]
    }
}


// ---------------------------------------------------------------- remapping the test mod
//
// Needed by every production-mode launch on 1.21.x - the standalone gametest and the Quilt check -
// because a test mod compiled against official names finds nothing at runtime, exactly like the
// mod itself. Registered for the whole legacy path rather than only where a gametest harness
// exists: Quilt runs on versions that have no harness at all.
if (legacy) {
    // Loom's remapper, reached through a task Loom itself created. An import fails (this script is
    // compiled before Loom's classes are visible to it) and so does Class.forName (the script's own
    // loader does not have them) - but remapJar is right there, and its class loader does.
    def remapJarType = tasks.getByName('remapJar').getClass().getClassLoader()
            .loadClass('net.fabricmc.loom.task.RemapJarTask')

    tasks.register('remapTestModJar', remapJarType) {
        group = 'verification'
        description = 'Remaps the test mod to intermediary so a production-mode client can load it.'
        dependsOn 'testModJar'
        inputFile = tasks.named('testModJar', Jar).flatMap { it.archiveFile }
        archiveFileName = 'hidemodels-test-remapped.jar'
        addNestedDependencies = false
    }

}

// ---------------------------------------------------------------- does it run on Quilt?
//
// Quilt Loader reads fabric.mod.json and runs Fabric entrypoints, so in principle the Fabric jar
// IS the Quilt jar. This launches it to find out, rather than claiming support from the fact that
// a compatibility layer exists.
//
// THE OPEN QUESTION WAS FABRIC API. Quilt's own fork of it, QFAPI, stopped at Minecraft 1.21 in
// alpha form in 2024 - but Quilt Loader turns out to load the real Fabric API, so that is not the
// limit it looked like.
//
// Registered for EVERY version, 26.x included. Whether Quilt Loader has a game provider for 26.x
// is exactly the kind of thing worth finding out by running it.
if (true) {
    def quiltLoaderLibraries = {
        File loaderJar = configurations.quiltLoaderRuntime.files.find {
            it.name.startsWith('quilt-loader')
        }
        if (loaderJar == null) {
            throw new GradleException('quilt-loader did not resolve - see the quiltLoaderRuntime '
                    + 'configuration')
        }
        def json = new java.util.zip.ZipFile(loaderJar).withCloseable { zip ->
            def entry = zip.entries().toList().find { it.name == 'quilt_installer.json' }
            entry == null ? null : zip.getInputStream(entry).getText('UTF-8')
        }
        if (json == null) {
            return []                  // no list to read; the classpath below still has the basics
        }
        def libs = new groovy.json.JsonSlurper().parseText(json).libraries
        def coords = ((libs.common ?: []) + (libs.client ?: []))*.name
        configurations.detachedConfiguration(*coords.collect { dependencies.create(it) }).files
    }

    tasks.register('runQuiltSmokeTest', JavaExec) {
        group = 'verification'
        description = "Launches ${mc} under QUILT Loader with the Fabric jar, to see if it runs."
        dependsOn(legacy ? ['remapJar', 'remapTestModJar'] : ['jar', 'testModJar'])
        dependsOn 'extractNatives', 'stubAssets', 'downloadMinecraft'

        doFirst {
            def mods = new File(runDir, 'mods')
            mods.mkdirs()
            delete fileTree(mods)
            copy {
                // 1.21.x needs the remapped jars; 26.x has nothing to remap, so the built ones are
                // what a user would install.
                from tasks.named(legacy ? 'remapJar' : 'jar').get().archiveFile
                from tasks.named(legacy ? 'remapTestModJar' : 'testModJar').get().archiveFile
                from configurations.fabricApiRuntime
                into mods
            }
            delete new File(runDir, 'smoketest-result.txt')
            writeTestClientOptions(new File(runDir, 'options.txt'))
        }

        classpath = files(clientJar) + mcLibJars + configurations.quiltLoaderRuntime +
                files(quiltLoaderLibraries) +
                (legacy ? configurations.intermediaryMappings : files())
        mainClass = 'org.quiltmc.loader.impl.launch.knot.KnotClient'
        workingDir = runDir

        jvmArgs = [
                "-Djava.library.path=${nativesDir}".toString(),
                "-Dorg.lwjgl.librarypath=${nativesDir}".toString(),
                '-Dhidemodels.smoketest=true',
                '-Djava.awt.headless=true',
        ]
        args = [
                '--gameDir', runDir.absolutePath,
                '--assetsDir', assetsDir.absolutePath,
                '--assetIndex', 'stub',
                '--accessToken', '0',
                '--version', mc,
                '--userType', 'legacy',
                '--username', 'QuiltTest',
        ]
        ignoreExitValue = true
    }

    tasks.register('quiltSmokeTest') {
        group = 'verification'
        description = 'Checks the Fabric jar runs under Quilt Loader on this Minecraft version.'
        dependsOn 'runQuiltSmokeTest'
        doLast {
            def f = new File(runDir, 'smoketest-result.txt')
            if (!f.isFile()) {
                throw new GradleException('no verdict under Quilt - the client died before reaching '
                        + 'the checks; see the output above')
            }
            def verdict = f.text.trim()
            if (!verdict.startsWith('PASS')) {
                throw new GradleException(verdict)
            }
            logger.lifecycle("quilt smoke test: ${verdict}")
        }
    }
}
